plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.moment'
version = '0.0.1-SNAPSHOT'
description = 'Moment'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web / Persistence / Security
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // DB
    implementation 'org.springframework.boot:spring-boot-flyway' // Boot 4: Flyway 자동구성 모듈
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.h2database:h2'
    // Boot 4는 H2 콘솔 자동구성이 별도 모듈 — dev 프로필의 /h2-console에 필요
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // API 문서 (Swagger UI) — springdoc 3.x가 Boot 4 대응
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Dev
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 통합 테스트 — PostgreSQL 동시성 검증 (Testcontainers, CI 전용)
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

// 기본 test: 빠른 단위·H2 테스트만. integration 태그는 제외한다(로컬에 Docker 불필요).
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// integrationTest: PostgreSQL(Testcontainers) 동시성 테스트. CI의 별도 잡에서 실행한다.
// Docker가 없으면 컨테이너 기동이 실패하며 태스크도 실패한다(조용히 스킵하지 않음).
tasks.register('integrationTest', Test) {
    description = 'Runs PostgreSQL integration/concurrency tests (requires Docker).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
