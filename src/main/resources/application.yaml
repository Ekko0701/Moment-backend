spring:
  application:
    name: moment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

moment:
  jwt:
    # 개발용 기본값 없음 — 운영은 MOMENT_JWT_SECRET 환경변수 필수(최소 256bit).
    # dev 프로필이 개발용 기본값을 아래에서 덮어쓴다. 미주입 시 기동 실패(fail-closed).
    secret: ${MOMENT_JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
  auth:
    apple:
      # 기본값 apple(운영 안전). dev 프로필이 stub으로 덮어쓴다.
      mode: ${MOMENT_APPLE_AUTH_MODE:apple}
      client-id: ${MOMENT_APPLE_CLIENT_ID:}
      team-id: ${MOMENT_APPLE_TEAM_ID:}
      key-id: ${MOMENT_APPLE_KEY_ID:}
      # AuthKey_*.p8 또는 DER를 통째로 base64 인코딩한 값. 원문 키를 저장소에 넣지 않는다.
      private-key-base64: ${MOMENT_APPLE_PRIVATE_KEY_BASE64:}
      # `openssl rand -base64 32`로 생성한 Apple refresh token AES-256 암호화 키.
      token-encryption-key-base64: ${MOMENT_APPLE_TOKEN_ENCRYPTION_KEY_BASE64:}
  invite:
    code-ttl: 24h
    invitation-ttl: 72h
    # 그룹 초대 코드는 재사용형이라 1:1 코드보다 길게 유지한다. 방장이 재발급하면 즉시 교체된다.
    group-code-ttl: 7d
  policy:
    # MVP 정책: 사용자당 활성 ONE_TO_ONE 스페이스 1개 (다중 스페이스 개방 시 false)
    single-space-enabled: true
    # 새 그룹 스페이스의 정원 (방장 포함)
    group-max-members: 6
  storage:
    # 기본값 s3(운영 안전). dev 프로필이 stub으로 덮어쓴다.
    # s3 모드는 버킷/리전/공개 URL 미주입 시 기동 실패(fail-closed).
    mode: ${MOMENT_STORAGE_MODE:s3}
    s3:
      bucket: ${MOMENT_STORAGE_S3_BUCKET:}
      region: ${MOMENT_STORAGE_S3_REGION:}
      # 업로드된 이미지를 서빙하는 공개 베이스 URL (CloudFront 또는 S3 정적 호스팅), 끝 슬래시 없이.
      public-base-url: ${MOMENT_STORAGE_S3_PUBLIC_BASE_URL:}
      # presigned PUT 서명 유효기간 — 클라이언트가 presign 직후 업로드하므로 짧게 유지한다.
      presign-ttl: 10m

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:moment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# 개발 전용 인증·스토리지 기본값 — 운영(prod)에는 존재하지 않는다.
moment:
  jwt:
    secret: dev-only-secret-key-change-me-0123456789abcdef
  auth:
    apple:
      mode: stub
  storage:
    mode: stub

logging:
  level:
    com.moment: debug

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MOMENT_DB_URL}
    username: ${MOMENT_DB_USERNAME}
    password: ${MOMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

# 운영에서는 API 문서를 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
