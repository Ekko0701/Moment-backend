name: Deploy

# release 브랜치에 푸시될 때만 배포한다. 평소 main 커밋은 운영에 영향 없음.
# 배포 방법: git push origin main:release
on:
  push:
    branches: [release]
  workflow_dispatch: {} # Actions 탭에서 수동 재실행용 (롤백 시 이전 커밋에서 Re-run)

permissions:
  id-token: write # OIDC 토큰 발급 — moment-github-deploy-role 위임에 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 151170151164.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPO: moment-server
  INSTANCE_ID: i-038d63c6b187fdf19

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # integrationTest = Testcontainers + 진짜 PostgreSQL.
      # H2에서만 통과하는 버그(타임라인 500 같은)를 배포 전에 잡는 관문.
      - run: ./gradlew test integrationTest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 (OIDC — 저장된 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::151170151164:role/moment-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 + 푸시 (태그 = 커밋 해시)
        run: |
          TAG=${GITHUB_SHA::7}
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -t "$ECR_REGISTRY/$ECR_REPO:$TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPO:$TAG"

      - name: EC2 배포 (SSM Run Command)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters "$(jq -n --arg tag "$TAG" --rawfile script scripts/remote-deploy.sh \
                '{commands: [("TAG=" + $tag + "\n" + $script)]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # 완료까지 폴링 (최대 5분)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text)
            [ "$STATUS" = "Success" ] && break
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::EC2 배포 실패 ($STATUS)"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --query StandardErrorContent --output text
              exit 1
            fi
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

      - name: 외부 도메인 최종 확인
        run: curl -sfS https://api.momentapplication.com/actuator/health | grep '"UP"'
