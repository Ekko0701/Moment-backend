name: CI

# main으로 들어오는 코드를 병합 전에 검증한다. 배포는 하지 않는다(배포는 deploy.yml).
# - PR: main을 대상으로 열거나 새 커밋을 올릴 때마다 실행
# - push: main에 병합된 뒤 한 번 더 실행해 main 자체가 통과 상태인지 확인
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 테스트만 돌리므로 저장소 읽기 권한이면 충분하다. 공개 저장소라 외부 PR도 이 워크플로를 실행한다.
permissions:
  contents: read

# 같은 PR에 커밋을 연달아 올리면 앞선 실행은 취소하고 최신 커밋만 검증한다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew test

      # Testcontainers로 진짜 PostgreSQL을 띄운다. H2에서만 통과하는 문제를 병합 전에 잡는다.
      - name: 통합 테스트 (PostgreSQL)
        run: ./gradlew integrationTest

      - name: 실패한 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
